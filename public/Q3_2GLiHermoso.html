<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
    <style>
        :focus {
            outline: 2px solid blue;
        }
        input:focus, select:focus, textarea:focus {
            background-color: lightyellow;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<form id="login" method="post"
onreset="return confirm('Do you really want to reset this form?');"
onblur="this.style.background='lightyellow';">

<fieldset form="login">

<legend><h2>Student Registration Form</h2></legend>
<label for="StudentID">Student ID</label><br><br>
<input type="number" id="StudentID" name="StudentID" required><br><br>
<label for="FullName">Full Name</label><br><br>
<input type="text" id="FullName" name="FullName" required><br><br>
<label for="Birthday">Birthday</label><br><br>
<input type="date" id="Birthday" name="Birthday" required><br><br>
<label for="Email">Email Address</label><br><br>
<input type="email" id="Email" name="Email" required><br><br>
<label for="MobilePhone">Mobile Phone</label><br><br>
<input type="text" id="MobilePhone" name="MobilePhone" required><br><br>

</fieldset><br>

<fieldset form="login">

  <legend><h2>Additional Information</h2></legend>
<label for="GradeLevel">Grade Level</label><br>
<select name="GradeLevel" id="GradeLevel" required>
  <option value="Grade 7">Grade 7</option>
  <option value="Grade 8">Grade 8</option>
  <option value="Grade 9">Grade 9</option>
  <option value="Grade 10">Grade 10</option>
  <option value="Grade 11">Grade 11</option>
  <option value="Grade 12">Grade 12</option>
</select><br><br>
<label for="InternExtern">Intern or Extern</label><br>
<input type="radio" id="Intern" name="InternExtern" value="Intern" required>
<label for="Intern">Intern</label>
<input type="radio" id="Extern" name="InternExtern" value="Extern" required>
<label for="Extern">Extern</label><br><br>

<label for="clubs">Preferred Organization/Club</label><br>
<select name="clubs" id="clubs" required>
  <option value="Art Club">Art Club</option>
  <option value="Science Club">Science Club</option>
  <option value="Drama Club">Drama Club</option>
  <option value="Music Club">Music Club</option>
  <option value="Sports Club">Sports Club</option>
</select><br><br>
<label for="reason">Why do you want to join?</label><br>
<textarea id="tArea" name="reason" rows="4" cols="50" required> </textarea>

</fieldset><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">
<button type="button" id="viewSignups">View Sign-Ups</button>
</form>

<!-- Link to external JavaScript file -->
<script src="Reg.js"></script>

</body>
</html>
